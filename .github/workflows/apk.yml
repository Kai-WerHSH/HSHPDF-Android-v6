name: Compilar APK

on:
  push:
    branches:
      - main
    paths:
      - "HSHPDF-Android/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK Debug
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: HSHPDF-Android

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: HSHPDF-apk
          path: HSHPDF-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
